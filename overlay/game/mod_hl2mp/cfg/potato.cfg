// HL2DM Portal: lowest graphics, for slow PCs.
// Run it once: start with the "HL2DM Portal (low graphics)" desktop shortcut, or
// open the console (~) and type:  exec potato
// The settings are saved, so later launches stay fast. Undo any of them in
// Options > Video > Advanced (or delete cfg/config.cfg to reset everything).
// Lowering the screen resolution in Options > Video helps the most on weak GPUs.

// Portals: auto quality, aiming for 45 fps (drops to solid portals if needed).
cl_portal_quality 4
cl_portal_auto_fps 45
cl_portal_resolution 0.5

// Textures and models: lowest detail.
mat_picmip 2
r_rootlod 2
mat_reducefillrate 1

// No anti-aliasing, cheapest texture filtering, no HDR/bloom/motion blur.
mat_antialias 0
mat_aaquality 0
mat_forceaniso 0
mat_trilinear 0
mat_hdr_level 0
mat_disable_bloom 1
mat_motion_blur_enabled 0
mat_colorcorrection 0

// Cheap shadows, water, sky and dynamic lights.
r_shadowrendertotexture 0
r_flashlightdepthtexture 0
r_waterforceexpensive 0
r_waterforcereflectentities 0
r_3dsky 0
r_dynamic 0

// Fewer decals, ragdolls, grass and client-side debris.
r_decals 32
mp_decals 32
g_ragdoll_maxcount 2
cl_ragdoll_collide 0
cl_detaildist 0
cl_detailfade 0
cl_phys_props_enable 0
cl_new_impact_effects 0

echo "HL2DM Portal: low graphics settings applied."
