<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex-Claude Chat</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="overlay">
	<form class="card" id="loginForm">
		<img src="icon.svg" alt="" width="48" height="48">
		<h1>Codex-Claude Chat</h1>
		<p>Pick a display name. Ping <b>@Claude</b>, <b>@Codex</b>, or <b>@Both</b> to bring the AIs in.</p>
		<input id="loginName" maxlength="32" placeholder="Your name" autocomplete="off" required>
		<button type="submit">Join</button>
		<p class="err" id="loginErr"></p>
	</form>
</div>

<div id="app" hidden>
	<aside id="sidebar">
		<div class="brand"><img src="icon.svg" alt="" width="22" height="22"> Codex-Claude Chat</div>

		<div class="section">
			<div class="section-head">Channels <button class="icon" id="addChannel" title="New channel">+</button></div>
			<ul id="channels"></ul>
		</div>

		<div class="section">
			<div class="section-head">AIs <button class="icon" id="recheck" title="Re-check installed CLIs">↻</button></div>
			<ul id="agents"></ul>
		</div>

		<div class="section">
			<div class="section-head">People online</div>
			<ul id="people"></ul>
		</div>

		<div class="section settings">
			<label><input type="checkbox" id="optSound"> Ping sound</label>
			<label><input type="checkbox" id="optNotify"> Desktop notifications</label>
			<label><input type="checkbox" id="optSyncOpen"> Expand AI sync by default</label>
			<button id="themeBtn" class="link">Toggle theme</button>
			<div class="me">You: <b id="meName"></b> <button class="link" id="renameBtn">change</button></div>
			<div class="workdir"><span id="workdir" title="Folder the AIs read and edit"></span> <button class="link" id="workdirBtn">change</button></div>
		</div>
	</aside>

	<main>
		<header>
			<button class="icon" id="menuBtn" title="Menu">☰</button>
			<h2 id="chanTitle"># general</h2>
			<input id="search" type="search" placeholder="Search messages">
			<button class="icon" id="exportBtn" title="Export channel as Markdown">⤓</button>
			<button class="icon" id="clearBtn" title="Clear channel">🗑</button>
		</header>

		<div id="banner" hidden></div>
		<div id="messages" aria-live="polite"></div>
		<div id="typing"></div>

		<form id="composer">
			<div id="context" hidden><span id="contextText"></span><button type="button" class="icon" id="contextClose" title="Cancel (Esc)">✕</button></div>
			<div class="pings">
				<button type="button" data-ping="Claude" class="ping claude">@Claude</button>
				<button type="button" data-ping="Codex" class="ping codex">@Codex</button>
				<button type="button" data-ping="Both" class="ping both">@Both</button>
				<span class="hint">Enter to send · Shift+Enter newline · ↑ edit last · /help</span>
			</div>
			<div class="row">
				<textarea id="input" rows="1" placeholder="Message #general" autocomplete="off"></textarea>
				<button type="submit" id="sendBtn">Send</button>
			</div>
			<ul id="mentionMenu" hidden></ul>
		</form>
	</main>
</div>

<div id="emojiPicker" hidden></div>
<div id="toast" hidden></div>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
