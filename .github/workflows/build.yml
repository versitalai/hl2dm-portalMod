# Builds Linux (Steam Runtime) + Windows binaries and packages the ready-to-play zip.
# Every push: zip uploaded as a workflow artifact. Tag v*: also published as a GitHub Release.
# Or Actions > build > Run workflow with release_tag (e.g. v0.3.0): builds that commit and creates tag + Release.
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # Docs-only pushes don't build (releases are started by hand or by a tag).
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a Release with this new tag (e.g. v0.3.0). Empty = build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Same image the SDK's buildallprojects uses, so binaries run on players' Steam Runtime.
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDK and apply mod
        run: scripts/setup.sh
      # Compiler cache: most of the tree is the unchanged SDK, so a push only
      # really compiles the files it touched. The ninja rules call
      # x86_64-linux-gnu-g++ by name; a ccache link with that name goes first
      # in PATH. The SDK is fetched fresh each run (new mtimes), hence the
      # sloppiness settings.
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Set up ccache
        run: |
          command -v ccache || { apt-get update -qq && apt-get install -y -qq ccache; }
          mkdir -p "$GITHUB_WORKSPACE/.ccache-bin"
          ln -sf "$(command -v ccache)" "$GITHUB_WORKSPACE/.ccache-bin/x86_64-linux-gnu-g++"
          echo "$GITHUB_WORKSPACE/.ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          ccache --zero-stats || true
      - name: Build
        run: |
          scripts/build_linux.sh
          ccache --show-stats || true
          # 64-bit dedicated server launcher for the server kit.
          cc -O2 -o sdk/game/mod_hl2mp/bin/linux64/srcds_portal64 packaging/server/srcds_portal64.c -ldl
      - name: Unit tests (portal math, hole carving)
        run: |
          tests/run_math_test.sh sdk
          tests/run_carve_test.sh sdk
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux64
          path: |
            sdk/game/mod_hl2mp/bin/linux64/client.so
            sdk/game/mod_hl2mp/bin/linux64/server.so
            sdk/game/mod_hl2mp/bin/linux64/srcds_portal64
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch SDK and apply mod
        shell: bash
        run: scripts/setup.sh
      - name: Generate solution
        shell: cmd
        working-directory: sdk/src
        run: devtools\bin\vpc.exe /hl2mp /define:SOURCESDK +everything /mksln hl2mp.sln
      - name: Build
        shell: cmd
        working-directory: sdk/src
        run: msbuild hl2mp.sln /m /p:Configuration=Release /v:minimal
      - uses: actions/upload-artifact@v4
        with:
          name: bin-x64
          path: |
            sdk/game/mod_hl2mp/bin/x64/client.dll
            sdk/game/mod_hl2mp/bin/x64/server.dll
          if-no-files-found: error

  # Sets up a real HL2DM dedicated server (app 232370, anonymous steamcmd) with
  # the release's server kit, then checks portal behavior in-engine.
  selftest:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux64
          path: bin-linux64
      # The HL2DM dedicated server (~930 MB) is cached; steamcmd then only
      # checks it's current. Saved right after install, before the mod goes in.
      - name: Cache key (week)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: srcds-cache
        with:
          path: ~/srcds
          key: hl2dm-srcds-${{ steps.week.outputs.week }}
          restore-keys: hl2dm-srcds-
      - name: Install dedicated server
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 gdb > /dev/null
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz
          # A cached install only needs an update check; a fresh one is verified.
          VALIDATE=validate
          [[ "${{ steps.srcds-cache.outputs.cache-matched-key }}" != "" ]] && VALIDATE=
          # First run updates steamcmd itself and can exit non-zero; retry.
          for i in 1 2 3; do
            ./steamcmd.sh +force_install_dir "$HOME/srcds" +login anonymous +app_update 232370 $VALIDATE +quit && break
          done
          ls "$HOME/srcds"
      - uses: actions/cache/save@v4
        if: steps.srcds-cache.outputs.cache-hit != 'true'
        with:
          path: ~/srcds
          key: hl2dm-srcds-${{ steps.week.outputs.week }}
      - name: Package
        run: |
          scripts/setup.sh
          mkdir -p sdk/game/mod_hl2mp/bin/linux64
          cp bin-linux64/* sdk/game/mod_hl2mp/bin/linux64/
          scripts/package.sh sdk selftest
      - name: Run self-test
        run: scripts/selftest.sh "$HOME/srcds"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-log
          path: ~/srcds/portal_selftest.log

  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SDK (game content) and apply mod
        run: scripts/setup.sh
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux64
          path: sdk/game/mod_hl2mp/bin/linux64
      - uses: actions/download-artifact@v4
        with:
          name: bin-x64
          path: sdk/game/mod_hl2mp/bin/x64
      - name: Package
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then VERSION="$RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="${GITHUB_REF_NAME}"
          else VERSION="${GITHUB_SHA::7}"; fi
          scripts/package.sh sdk "$VERSION"
          echo "ZIP=$(ls dist/*.zip)" >> "$GITHUB_ENV"
      - name: Test Linux installer
        run: |
          mkdir -p "$RUNNER_TEMP/Steam/steamapps"
          dist/stage/install.sh --steam-dir "$RUNNER_TEMP/Steam"
          test -f "$RUNNER_TEMP/Steam/steamapps/sourcemods/hl2dm_portal/bin/linux64/client.so"
          test -f "$RUNNER_TEMP/Steam/steamapps/sourcemods/hl2dm_portal/gameinfo.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hl2dm_portal
          path: dist/stage/
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ env.ZIP }}

  # Runs install.bat for real: fresh install, reinstall over a briefly locked
  # DLL (the "sharing violation" case), and a DLL that stays locked.
  test-windows-installer:
    needs: package
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hl2dm_portal
          path: pkg
      - name: Test install.bat
        shell: pwsh
        env:
          HL2DM_NO_PAUSE: '1'
          HL2DM_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $steam = Join-Path $env:RUNNER_TEMP 'Steam'
          New-Item -ItemType Directory -Force "$steam\steamapps" | Out-Null
          $dll = "$steam\steamapps\sourcemods\hl2dm_portal\bin\x64\client.dll"
          $src = (Resolve-Path 'pkg\hl2dm_portal\bin\x64\client.dll').Path

          function Run-Install {
            cmd /c "pkg\install.bat `"$steam`"" | Out-Host
            return $LASTEXITCODE
          }
          function Lock-For($seconds) {
            $j = Start-Job -ArgumentList $dll, $seconds {
              param($p, $s)
              $f = [System.IO.File]::Open($p, 'Open', 'ReadWrite', 'None')
              Start-Sleep $s
              $f.Close()
            }
            Start-Sleep 3
            return $j
          }

          Write-Host '== fresh install (with steam.exe and server.txt: desktop launchers)'
          New-Item -ItemType File -Force "$steam\steam.exe" | Out-Null
          Set-Content -Path 'pkg\server.txt' -Value '203.0.113.5:27016'
          if ((Run-Install) -ne 0) { throw 'fresh install failed' }
          if (-not (Test-Path $dll)) { throw 'client.dll not installed' }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $join = Get-Content "$desktop\Join HL2DM Portal server.bat" -Raw
          if ($join -notmatch '\+connect 203\.0\.113\.5:27016') { throw "join launcher wrong: $join" }
          if ($join -notmatch '-applaunch 243750 -game') { throw "join launcher wrong: $join" }
          if (-not (Test-Path "$desktop\HL2DM Portal.bat")) { throw 'launcher missing' }
          if ((Get-Content "$desktop\HL2DM Portal (low graphics).bat" -Raw) -notmatch '\+exec potato') { throw 'low graphics launcher wrong' }
          Remove-Item 'pkg\server.txt'

          Write-Host '== update.bat: an old copy updates itself to the latest release'
          $moddir = "$steam\steamapps\sourcemods\hl2dm_portal"
          if (-not (Test-Path "$moddir\update.bat")) { throw 'update.bat not installed' }
          if ((Get-Content "$desktop\HL2DM Portal.bat" -Raw) -notmatch 'update\.bat" quiet') { throw 'launcher does not run the update check' }
          Set-Content -Path "$moddir\version.txt" -Value 'v0.0.1' -NoNewline
          cmd /c "`"$moddir\update.bat`"" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'update.bat failed' }
          $latest = (Invoke-RestMethod -Uri 'https://api.github.com/repos/${{ github.repository }}/releases/latest' -Headers @{ 'User-Agent' = 'ci'; 'Authorization' = "Bearer $env:HL2DM_GITHUB_TOKEN" }).tag_name
          $now = (Get-Content "$moddir\version.txt" -Raw).Trim()
          if ($now -ne $latest) { throw "version.txt is $now after the update, expected $latest" }
          Write-Host '== update.bat quiet when up to date: prints nothing'
          $out = (cmd /c "`"$moddir\update.bat`" quiet" 2>&1 | Out-String).Trim()
          if ($out) { throw "quiet check printed: $out" }

          Write-Host '== install given the sourcemods folder itself'
          $mods = Join-Path $env:RUNNER_TEMP 'Other\sourcemods'
          cmd /c "pkg\install.bat `"$mods`"" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'install into a sourcemods folder failed' }
          if (-not (Test-Path "$mods\hl2dm_portal\bin\x64\client.dll")) { throw 'not installed into the sourcemods folder' }

          Write-Host '== no path given, Steam in an odd folder, found through a desktop shortcut'
          $odd = 'C:\hl2odd\x\y\Steam'
          New-Item -ItemType Directory -Force "$odd\steamapps" | Out-Null
          New-Item -ItemType File -Force "$odd\steam.exe" | Out-Null
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Steam (odd).lnk'
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk); $sc.TargetPath = "$odd\steam.exe"; $sc.Save()
          cmd /c "pkg\install.bat" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'install via shortcut search failed' }
          if (-not (Test-Path "$odd\steamapps\sourcemods\hl2dm_portal\gameinfo.txt")) { throw 'not installed via shortcut search' }
          Remove-Item $lnk

          Write-Host '== no path given, no shortcut: found by searching the drives'
          Remove-Item -Recurse -Force "$odd\steamapps\sourcemods"
          cmd /c "pkg\install.bat" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'install via drive search failed' }
          if (-not (Test-Path "$odd\steamapps\sourcemods\hl2dm_portal\gameinfo.txt")) { throw 'not installed via drive search' }

          Write-Host '== server kit on a fake HL2DM server'
          $srv = Join-Path $env:RUNNER_TEMP 'srcds'
          New-Item -ItemType Directory -Force "$srv\hl2mp" | Out-Null
          New-Item -ItemType File -Force "$srv\srcds_win64.exe" | Out-Null
          cmd /c "pkg\server\install_server.bat `"$srv`" 27020" | Out-Host
          if ((Get-Content "$srv\hl2dm_portal\gameinfo.txt" -Raw) -notmatch 'all_source_engine_paths') { throw 'server gameinfo not replaced' }
          if (-not (Test-Path "$srv\hl2dm_portal\bin\x64\server_srv.dll")) { throw 'server_srv.dll missing' }
          if ((Get-Content "$srv\start_portal_server.bat" -Raw) -notmatch 'srcds_win64\.exe -console -game hl2dm_portal -port 27020') { throw 'start script wrong' }

          Write-Host '== reinstall while client.dll is locked for 8 s (retries should win)'
          (Get-Item $src).LastWriteTime = Get-Date
          $j = Lock-For 8
          if ((Run-Install) -ne 0) { throw 'reinstall over a briefly locked file failed' }
          Wait-Job $j | Out-Null
          if ((Get-Item $dll).LastWriteTime -lt (Get-Item $src).LastWriteTime.AddSeconds(-2)) { throw 'client.dll not updated' }

          Write-Host '== client.dll stays locked (must fail cleanly, not hang)'
          (Get-Item $src).LastWriteTime = (Get-Date).AddMinutes(1)
          $j = Lock-For 60
          if ((Run-Install) -eq 0) { throw 'install should have failed while the file was locked' }
          Stop-Job $j; Remove-Job $j -Force
          Write-Host 'install.bat OK'
          # The last native exit code (the expected failure above) would fail the step.
          exit 0

  release:
    needs: [package, test-windows-installer, selftest]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Find zip
        run: echo "ZIP=$(ls dist/*.zip)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it doesn't exist yet.
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: HL2DM Portal ${{ github.event.inputs.release_tag || github.ref_name }}
          files: ${{ env.ZIP }}
          generate_release_notes: true
