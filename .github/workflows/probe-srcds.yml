# Temporary: get the self-test running on the dedicated server without
# rebuilding (uses binaries from an earlier build run).
name: probe-srcds
on:
  push:
    paths: ['.github/workflows/probe-srcds.yml', 'scripts/selftest.sh', 'tests/srcds64.c']
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux64
          path: bin-linux64
          run-id: 39687127862
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dedicated server
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update -qq && sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 gdb > /dev/null
          mkdir -p ~/steamcmd && cd ~/steamcmd
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar xz
          for i in 1 2 3; do ./steamcmd.sh +force_install_dir "$HOME/srcds" +login anonymous +app_update 232370 +quit && break; done
          nm -D "$HOME/srcds/bin/linux64/dedicated_srv.so" | grep -i "main" | head
          head -60 "$HOME/srcds/srcds_run" | grep -n "64\|BIN\|LD_LIBRARY" | head -20
      - name: Assemble mod
        run: |
          scripts/setup.sh
          mkdir -p sdk/game/mod_hl2mp/bin/linux64
          cp bin-linux64/*.so sdk/game/mod_hl2mp/bin/linux64/
          scripts/package.sh sdk probe
          cp -r dist/stage/hl2dm_portal "$HOME/srcds/"
      - name: Run self-test
        run: scripts/selftest.sh "$HOME/srcds" || (tail -150 "$HOME/srcds/portal_selftest.log"; exit 1)
